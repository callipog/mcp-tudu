name: release

# Empacota o servidor num executável único e anexa à release.
# Dispara ao empurrar uma tag: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install

      - name: Gerar o executável
        run: npm run build:exe

      - name: Conferir que o executável responde ao MCP
        shell: pwsh
        run: |
          if (-not (Test-Path build/mcp-tudu.exe)) { throw "executável não foi gerado" }

          # Fala MCP de verdade com ele: um initialize pelo stdin precisa
          # devolver o serverInfo. Melhor descobrir aqui do que na release.
          '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' |
            Out-File -FilePath req.txt -Encoding ascii
          $p = Start-Process -FilePath build/mcp-tudu.exe -PassThru -NoNewWindow `
            -RedirectStandardInput req.txt -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          Start-Sleep -Seconds 8
          if (-not $p.HasExited) { $p.Kill() }

          $saida = if (Test-Path out.txt) { Get-Content out.txt -Raw } else { '' }
          if ($saida -notmatch 'tudu-mcp') {
            Write-Host "stdout: $saida"
            if (Test-Path err.txt) { Write-Host ("stderr: " + (Get-Content err.txt -Raw)) }
            throw "o executável não respondeu ao initialize do MCP"
          }
          $mb = [math]::Round((Get-Item build/mcp-tudu.exe).Length / 1MB, 1)
          Write-Host "executável respondeu ao MCP ($mb MB)"

      # Em bash, não em PowerShell: as notas têm crases e acentos, e crase é
      # caractere de escape no PowerShell — o comando quebrava por causa disso.
      - name: Publicar na release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/mcp-tudu.exe \
            --title "mcp-tudu $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
